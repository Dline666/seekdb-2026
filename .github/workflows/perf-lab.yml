# Linux x86_64 / cgroup v2 performance lab. Lives only on the ci/perf-lab
# branch. Builds the Dockerfile of each listed commit of the submission
# branch and runs lab/lab.py with the judge's container limits. Results are
# committed to the ci/perf-results branch (runs/<run id>/).
name: perf-lab
on:
  push:
    branches: [ci/perf-lab]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: environment
        run: |
          {
            uname -a; nproc; grep -m1 'model name' /proc/cpuinfo
            grep -o -w 'avx2\|fma\|avx512f' /proc/cpuinfo | sort | uniq -c
            stat -fc %T /sys/fs/cgroup; docker info --format '{{.CgroupDriver}} {{.CgroupVersion}} {{.ServerVersion}}'
            df -hT "$RUNNER_TEMP"; free -m
          } 2>&1 | tee env.txt
          python3 -m pip install --quiet --user --break-system-packages numpy
      - name: build images
        run: |
          set -e
          for c in $(cat lab/commits.txt); do
            git fetch --depth=1 origin "$c"
            mkdir -p "$RUNNER_TEMP/src-$c"
            git archive "$c" | tar -x -C "$RUNNER_TEMP/src-$c"
            docker build -q -t "mvdb:$c" "$RUNNER_TEMP/src-$c" | tee -a build.txt
          done
      - name: go tests on linux/amd64 (each commit, with -race)
        run: |
          set -e
          for c in $(cat lab/commits.txt); do
            echo "== $c" | tee -a gotest.txt
            docker run --rm -v "$RUNNER_TEMP/src-$c/minivectordb":/src -w /src golang:1.22 \
              sh -c 'go vet ./... && go test -count=1 ./... && go test -race -count=1 ./...' 2>&1 | tee -a gotest.txt
          done
      - name: in-process phase profile (2 CPUs)
        run: |
          for c in $(cat lab/commits.txt); do
            echo "== $c" | tee -a profile.txt
            docker run --rm --cpus=2 -e MVDB_PHASES=1 -v "$RUNNER_TEMP/src-$c/minivectordb":/src -w /src golang:1.22 sh -c '
              go test ./internal/engine -run "TestPhaseBreakdown|TestWritePhases|TestPrefilterBound|TestKernelPathsAgree" -count=1 -v 2>&1 | grep -E "PHASES|worst|PASS|FAIL|SKIP"
              go test ./internal/engine -run TestPhaseBreakdown -count=1 -cpuprofile /tmp/q.prof -o /tmp/e.test >/dev/null 2>&1
              go tool pprof -top -nodecount=30 /tmp/e.test /tmp/q.prof 2>/dev/null | sed -n 4,40p
              go test ./internal/engine -run TestWritePhases -count=1 -cpuprofile /tmp/w.prof -o /tmp/e.test >/dev/null 2>&1
              go tool pprof -top -nodecount=30 /tmp/e.test /tmp/w.prof 2>/dev/null | sed -n 4,40p' 2>&1 | tee -a profile.txt
          done
      - name: protocol_check and kill -9 (each commit, docker image)
        run: |
          set -e
          for c in $(cat lab/commits.txt); do
            echo "== $c" | tee -a regress.txt
            (cd "$RUNNER_TEMP/src-$c" && python3 protocol_check/run.py --image "mvdb:$c" --output "$RUNNER_TEMP/pc-$c") > "$RUNNER_TEMP/pc-$c.log" 2>&1 || true
            python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print('protocol_check passed=%s pass=%d/%d' % (r['passed'], sum(c['status']=='PASS' for c in r['cases']), len(r['cases'])))" "$RUNNER_TEMP/pc-$c/result.json" | tee -a regress.txt
            id=$(docker create "mvdb:$c"); docker cp "$id":/app/minivectordb "$RUNNER_TEMP/bin-$c"; docker rm "$id" >/dev/null
            mkdir -p "$RUNNER_TEMP/crash-$c"
            for s in 1 2 3; do
              MVDB_TMP="$RUNNER_TEMP/crash-$c" python3 "$RUNNER_TEMP/src-$c/minivectordb/tools/crash_test.py" --bin "$RUNNER_TEMP/bin-$c" --rounds 40 --seed $s 2>&1 | tee -a regress.txt
            done
          done
      - name: lab
        run: |
          args=""
          for c in $(cat lab/commits.txt); do args="$args $c=mvdb:$c"; done
          mkdir -p "$RUNNER_TEMP/data"
          LAB_TMP="$RUNNER_TEMP/data" python3 lab/lab.py --images $args --rounds $(cat lab/rounds.txt) --out lab-results.jsonl 2>&1 | tee lab-log.txt
      - name: summary
        if: always()
        run: python3 lab/summary.py lab-results.jsonl | tee summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: publish results
        if: always()
        run: |
          set -e
          out="$RUNNER_TEMP/out/runs/$GITHUB_RUN_ID"
          mkdir -p "$out"
          cp env.txt build.txt gotest.txt profile.txt regress.txt lab-results.jsonl lab-log.txt summary.md lab/commits.txt "$out"/ 2>/dev/null || true
          echo "$GITHUB_SHA" > "$out/lab-sha.txt"
          cd "$RUNNER_TEMP/out"
          git init -q
          git config user.name perf-lab
          git config user.email perf-lab@users.noreply.github.com
          git remote add origin "$(git -C "$GITHUB_WORKSPACE" config --get remote.origin.url)"
          hdr=$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)
          git config http.https://github.com/.extraheader "$hdr"
          if git fetch -q --depth=1 origin ci/perf-results; then git reset -q FETCH_HEAD; fi
          git add runs
          git commit -q -m "perf-lab run $GITHUB_RUN_ID"
          git push -q origin HEAD:refs/heads/ci/perf-results
